[project]
name = "scicomp26-submission"
version = "0.1.0"
description = "SCICOMP26 training and submission environment"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0",
  "numpy==1.26.4",
  "ninja==1.11.1.4",
  "ai2-olmo-core==2.6.0",
  "PyYAML==6.0.3",
  "transformers==5.18.0",
  "tokenizers==0.23.1",
  "wandb==0.30.0",
  "safetensors==0.8.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
