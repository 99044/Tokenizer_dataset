# OLMo Hybrid scaling-family short pretraining config.
run:
  name: olmo_hybrid_scaling_250m
  seed: 42
scaling:
  family: olmo_hybrid_v1
  nominal_size: 250m
  expected_total_parameters: 254467368
  parameter_count_vocab_size: 32768
  target_training_tokens: 170000000
  planned_training_tokens: 170393600
  tokens_per_update: 524288
  checkpoint_interval_tokens: 25165824
  learning_rate_rule: 2e-4 * sqrt(1792 / hidden_size), rounded
  flops_accounting: complete Hybrid operator ledger with scalar-op-cost 1
budget:
  total_training_flops: 299638724787417600
model:
  type: olmo_hybrid_scaling
  num_layers: 16
  hidden_size: 896
  num_attention_heads: 7
  num_key_value_heads: 7
  attention_head_dim: 128
  intermediate_size: 3584
  activation: swiglu
  normalization: rmsnorm
  normalization_style: reordered_norm
  rms_norm_eps: 1.0e-06
  qk_norm: true
  position_encoding: rope
  rope_theta: 500000
  attention_window_pattern:
  - 4096
  - 4096
  - 4096
  - -1
  force_full_attention_on_first_layer: false
  force_full_attention_on_last_layer: true
  block_pattern:
  - gdn
  - gdn
  - gdn
  - attn
  gdn_num_heads: 7
  gdn_num_value_heads: 7
  gdn_head_dim: 96
  gdn_value_expand: 2.0
  gdn_allow_neg_eigval: true
  gdn_conv_size: 4
  gdn_norm_eps: 1.0e-05
  context_length: 8192
  vocab_size: 32768
  tie_word_embeddings: true
  attention_bias: false
  mlp_bias: false
  dropout: 0.0
training:
  dtype: bfloat16
  max_steps: 325
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  gradient_checkpointing: false
optimizer:
  name: adamw
  learning_rate: 0.000283
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.1
scheduler:
  name: constant
  warmup_steps: 20
  cooldown_steps: 0
data:
  tokenizer_path: null
  train_path: null
  validation_path: null
  format: npy_packed_tokens
  requires_document_boundaries: true
logging:
  backend: wandb
  entity: echo-lab
  project: scicomp26-scaling
  log_every_steps: 1
  eval_every_steps: 24
  eval_batches: 8
  checkpoint_every_steps: 48
output:
  directory: runs/scaling/olmo_hybrid_250m
