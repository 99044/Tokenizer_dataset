# OLMo Hybrid 1B with periodic Gated Delta Net and global attention.

run:
  name: olmo_hybrid_1b_1e19
  seed: 42

budget:
  total_training_flops: 1.0e+19

model:
  type: olmo_hybrid_1b
  num_layers: 16
  hidden_size: 1792
  num_attention_heads: 14
  num_key_value_heads: 14
  attention_head_dim: 128
  intermediate_size: 7168
  activation: swiglu
  normalization: rmsnorm
  normalization_style: reordered_norm
  rms_norm_eps: 1.0e-6
  qk_norm: true
  position_encoding: rope
  rope_theta: 500000
  attention_window_pattern: [4096, 4096, 4096, -1]
  force_full_attention_on_first_layer: false
  force_full_attention_on_last_layer: true
  block_pattern: [gdn, gdn, gdn, attn]

  gdn_num_heads: 14
  gdn_num_value_heads: 14
  gdn_head_dim: 96
  gdn_value_expand: 2.0
  gdn_allow_neg_eigval: true
  gdn_conv_size: 4
  gdn_norm_eps: 1.0e-5

  context_length: 8192
  vocab_size: null  # Set from the selected tokenizer.
  tie_word_embeddings: true
  attention_bias: false
  mlp_bias: false
  dropout: 0.0

training:
  dtype: bfloat16
  max_steps: null
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: false

optimizer:
  name: adamw
  learning_rate: null
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1

scheduler:
  name: cosine
  warmup_steps: null

data:
  tokenizer_path: null
  train_path: null
  validation_path: null
  format: npy_packed_tokens
  requires_document_boundaries: true

logging:
  backend: wandb
  entity: echo-lab
  project: scicomp26
  log_every_steps: 10
  eval_every_steps: 100
  checkpoint_every_steps: 100

output:
  directory: runs/olmo_hybrid_1b_1e19
